name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.11.23'
      - name: Lint
        run: uvx --from ruff==0.16.10 ruff check src recipes experiments/v1.1-runtime-acceptance experiments/v1.2-acceptance experiments/archive_privacy.py experiments/source-accessibility/probe.py experiments/due-diligence/inventory.py
      - name: Format
        run: uvx --from ruff==0.16.10 ruff format --check src recipes experiments/v1.1-runtime-acceptance experiments/v1.2-acceptance
  runtime:
    name: Runtime (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [core, offline]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.11.23'
          enable-cache: true
      - name: Install PostgreSQL 17 tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          printf '%s\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/seal-pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Install frozen dependencies
        run: uv sync --frozen
      - name: Run fixed acceptance collection
        run: |
          umask 077
          uv run --frozen python experiments/v1.2-acceptance/ci.py --group '${{ matrix.group }}' --output 'artifacts/ci-${{ matrix.group }}'
      - name: Publish metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-${{ matrix.group }}
          path: artifacts/ci-public/${{ matrix.group }}.json
          if-no-files-found: warn
          retention-days: 7
