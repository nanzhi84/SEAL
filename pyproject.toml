[project]
name = "seal"
version = "0.3.0"
description = "Crawl4AI source collection, response archives and URL resource timelines"
requires-python = "==3.12.*"
dependencies = [
    "crawl4ai[pdf]==0.9.4",
    "aiohttp>=3.13,<4",
    "procrastinate>=3,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "rich>=14,<15",
    "protego>=0.6,<1",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
seal = "seal.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
