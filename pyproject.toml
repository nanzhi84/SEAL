[project]
name = "seal"
version = "0.1.1"
description = "Trusted recipe Runtime with archived inputs and traceable execution"
requires-python = "==3.12.*"
dependencies = [
    "jsonschema>=4,<5",
    "procrastinate>=3,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2,<3",
    "pypdf>=6,<7",
    "pyyaml>=6,<7",
    "scrapy>=2.13,<3",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
seal = "seal.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
