family: public-business-resources
entrypoint: recipe:BusinessSpider
params_schema:
  type: object
  additionalProperties: false
  required: [source]
  properties:
    source:
      type: string
      enum: [dd-017, dd-041, dd-250, dd-247, dd-468, dd-102, dd-357]
    permit_stage:
      type: string
      enum: [regions, plan, collect]
    province:
      type: string
      pattern: '^[0-9]{12}$'
    city:
      type: string
      pattern: '^(?:[0-9]{12})?$'
    management:
      type: string
      enum: ['', '0', '1']
    first_page:
      type: integer
      minimum: 1
      maximum: 3000
    last_page:
      type: integer
      minimum: 1
      maximum: 3000
