family: public-document-pipeline
entrypoint: recipe:DocumentsSpider
params_schema:
  type: object
  additionalProperties: false
  properties:
    max_depth: {type: integer, minimum: 0, maximum: 100, default: 12}
    max_query_variants: {type: integer, minimum: 1, maximum: 1000, default: 40}
    exclude_patterns:
      type: array
      maxItems: 100
      items: {type: string, minLength: 1, maxLength: 2000}
    expand_homepage: {type: boolean, default: false}
    discover_sitemaps: {type: boolean, default: false}
    extract_business: {type: boolean, default: false}
    options:
      type: object
      additionalProperties: false
      properties:
        body_css: {type: string, minLength: 1, maxLength: 2000}
        title_css: {type: string, minLength: 1, maxLength: 2000}
        format:
          type: string
          enum: [html, pdf, docx, xls, xlsx, csv, txt, json, image]
        csv_delimiter: {type: string, minLength: 1, maxLength: 1}
extraction_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: urn:seal:documents:business:v1
  type: object
  additionalProperties: false
  required: [title, body]
  properties:
    title: {type: [string, 'null']}
    body: {type: [string, 'null']}
