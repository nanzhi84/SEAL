family: seeded-public-site
entrypoint: recipe:SeededSpider
params_schema:
  type: object
  additionalProperties: false
  properties:
    max_depth: {type: integer, minimum: 0, maximum: 100, default: 12}
    max_query_variants: {type: integer, minimum: 1, maximum: 1000, default: 40}
    exclude_patterns:
      type: array
      maxItems: 100
      items: {type: string, minLength: 1, maxLength: 2000}
    expand_homepage: {type: boolean, default: true}
    discover_sitemaps: {type: boolean, default: true}
    specific_rules:
      type: array
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required: [title, body]
        properties:
          hosts: {type: array, items: {type: string}}
          path_regex: {type: string}
          match_css: {type: string}
          title: {type: string, minLength: 1}
          body: {type: string, minLength: 1}
          date: {type: [string, 'null']}
          record_type: {type: string, minLength: 1}
          schema_version: {type: string, minLength: 1}
