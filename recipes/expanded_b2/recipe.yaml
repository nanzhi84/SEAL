family: expanded-static-public-business-b2
entrypoint: recipe:ExpandedB2Spider
params_schema:
  type: object
  additionalProperties: false
  required: [source, mode, urls]
  properties:
    source:
      type: string
      enum: [dd-318, dd-322, dd-328, dd-331, dd-332, dd-333, dd-338, dd-339, dd-340, dd-341, dd-345, dd-346, dd-350, dd-352, dd-369, dd-372, dd-374, dd-380, dd-389, dd-445, dd-448, dd-449, dd-450, dd-455, dd-466, dd-474, dd-479, dd-481, dd-484, dd-485]
    mode: {type: string, enum: [html, pdf]}
    urls:
      type: array
      minItems: 1
      maxItems: 2
      uniqueItems: true
      items: {type: string, minLength: 10}
    title_selector: {type: string, minLength: 2}
    body_selector: {type: string, minLength: 2}
    body_segments: {type: boolean}
    attachment_paths:
      type: array
      minItems: 1
      maxItems: 1
      items: {type: string, minLength: 5}
    pdf_title_parts:
      type: array
      minItems: 1
      maxItems: 2
      items: {type: string, minLength: 5}
    table_rows:
      type: array
      minItems: 1
      maxItems: 8
      items: {type: integer, minimum: 0, maximum: 200}
