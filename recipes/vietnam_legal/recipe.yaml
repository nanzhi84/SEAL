family: vietnam-official-legal-metadata
entrypoint: recipe:VietnamLegalSpider
params_schema:
  type: object
  additionalProperties: false
  properties:
    search:
      type: object
      additionalProperties: false
      required:
      - url
      - year
      - category_ids
      properties:
        url:
          type: string
          format: uri
        year:
          type: integer
          minimum: 1000
          maximum: 9999
        category_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            pattern: ^[0-9]{1,8}$
    membership_urls:
      type: array
      maxItems: 10
      uniqueItems: true
      items:
        type: string
        format: uri
