name: seal-local
services:
  minio:
    image: seal-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile_inline: |
        # Official source release, including the October 2025 security fix.
        FROM golang:1.26-bookworm AS build
        RUN CGO_ENABLED=0 go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
        
        FROM minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
        COPY --from=build /go/bin/minio /usr/bin/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run python -m seal.local_storage first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run python -m seal.local_storage first}
    ports:
      - "127.0.0.1:${SEAL_MINIO_PORT:-19000}:9000"
      - "127.0.0.1:${SEAL_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - ${SEAL_MINIO_DATA:-./minio}:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 2s
      timeout: 2s
      retries: 30
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: seal
      POSTGRES_DB: seal
      POSTGRES_PASSWORD: ${SEAL_POSTGRES_PASSWORD:?Run python -m seal.local_storage first}
    ports:
      - "127.0.0.1:${SEAL_POSTGRES_PORT:-15432}:5432"
    volumes:
      - ${SEAL_POSTGRES_DATA:-./work/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U seal -d seal]
      interval: 2s
      timeout: 2s
      retries: 30
  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run python -m seal.local_storage first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run python -m seal.local_storage first}
      SEAL_S3_ACCESS_KEY: ${SEAL_S3_ACCESS_KEY:?Run python -m seal.local_storage first}
      SEAL_S3_SECRET_KEY: ${SEAL_S3_SECRET_KEY:?Run python -m seal.local_storage first}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        cat >/tmp/policy.json <<'POLICY'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:ListBucket"],
              "Resource": ["arn:aws:s3:::seal-archive"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject"],
              "Resource": ["arn:aws:s3:::seal-archive/*"]
            }
          ]
        }
        POLICY
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing local/seal-archive >/dev/null
        mc admin user add local "$$SEAL_S3_ACCESS_KEY" "$$SEAL_S3_SECRET_KEY" >/dev/null
        mc admin policy create local seal-archive /tmp/policy.json >/dev/null
        mc admin policy attach local seal-archive --user "$$SEAL_S3_ACCESS_KEY" >/dev/null
