# 来源地图：docs/reference/尽职调查核验入口地图.md#dd-492
# 用户授权激进采集：忽略 robots，保留 TLS、公开地址、域名与路径边界。
# 原生 vietnam_law Adapter：ASP.NET 列表 POST 翻页、详情元数据与 PDF/DOC/DOCX/RTF/ZIP 原件全部经受控
# Acquisition 归档；任务与分页水位由 SEAL 持久任务与 frontier.checkpoint 管理，不使用 SQLite 队列。
# 有界试采：adapter_options.max_pages 限定列表页数，budget.documents 限定文档目标数；样本不代表全历史覆盖。
id: dd-492
adapter: vietnam_law
adapter_options:
  max_pages: 1
entry_urls:
- https://vanban.chinhphu.vn/
allowed_hosts:
- vanban.chinhphu.vn
- datafiles.chinhphu.vn
host_path_scopes:
  vanban.chinhphu.vn: [/]
  datafiles.chinhphu.vn: [/cpp/files/vbpq/]
archive_approved: true
scope: 越南政府文献门户公开历史列表、文书详情及 vbpq 路径原件（PDF/DOC/DOCX/RTF/ZIP）与正文；保留官方来源署名。列表经 ASP.NET 分页发现，有界页数与文档数不代表全量；扫描页使用越南语 OCR，损坏、缺件或未过质量门禁明确报错。
robots: false
recheck_seconds: 86400
concurrency: 4
delay: 0.0
budget:
  requests: 10000
  seconds: 3600
  response_bytes: 134217728
  documents: 10000
fetch:
  mode: http
  max_depth: 1
  page_timeout_ms: 300000
metadata:
  source_name: 越南政府文献门户（vanban.chinhphu.vn）
  document_type: 法律法规
  language: vi
  jurisdiction: VN
documents:
  detail_body: never # 详情页只提供元数据；无原件时不以元数据页冒充正文
  attachment_title: file_name
ocr:
  languages: vie
  dpi: 96
